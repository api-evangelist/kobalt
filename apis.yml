name: Kobalt
description: 'Kobalt Music Group is an independent music rights management and administrative
  publishing company founded in 2000 by Willard Ahdritz, operating from New York and
  London. Unlike traditional publishers it administers copyrights rather than owning
  them, running Kobalt Music Publishing, a neighbouring rights division, and AMRA,
  the digital-first collection society it acquired in 2014. Royalty and rights processing
  runs on KTech, the rights and content management platform built to independently
  serve both Kobalt Music Publishing and AMRA at the scale of billions of music micro-transactions,
  with songwriters and rightsholders viewing statements and analytics through the authenticated
  Kobalt Portal. Kobalt publishes no public developer program: a 2026-07-19 probe found
  no developer portal, no API documentation, no OpenAPI or AsyncAPI description, and
  no API discovery documents under /.well-known/. Integration is arranged commercially
  through Kobalt or KTech rather than through a self-service API.'
